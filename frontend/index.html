<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>previewer</title>
  </head>
  <body>
    <div id="app" hidden>
      <header id="app-bar" class="pv-bar">
        <span class="pv-brand">previewer</span>
        <div id="project-slot" class="pv-project"></div>
        <div id="view-slot" class="pv-seg-group"></div>
        <span class="pv-sep"></span>
        <div id="text-actions-slot" class="pv-actions"></div>
        <span class="pv-spacer"></span>
        <div id="nav-slot" class="pv-actions"></div>
        <div id="theme-slot" class="pv-actions"></div>
        <div id="account-slot" class="pv-actions"></div>
        <input id="upload" type="file" accept=".zip" hidden>
      </header>
      <div id="error-slot" class="pv-errorbar" hidden></div>
      <div id="workspace">
        <div class="workspace-docs">
          <div id="tabs" class="pv-tabs"></div>
          <div class="docs-body">
            <aside id="docs-sidebar">
              <h2>Arquivos</h2>
              <div id="file-list" class="pv-tree-host"></div>
            </aside>
            <div
              id="sidebar-resizer"
              class="pv-resizer"
              role="separator"
              aria-orientation="vertical"
              aria-label="Redimensionar painel de arquivos"
            ></div>
            <div class="panes">
              <section class="pane">
                <div id="editor" class="editor-host"></div>
                <div id="cat-host" class="cat-host" hidden></div>
              </section>
              <section class="pane" id="original-pane">
                <div id="original" class="editor-host"></div>
              </section>
              <div
                id="preview-resizer"
                class="pv-resizer pv-resizer--preview"
                role="separator"
                aria-orientation="vertical"
                aria-label="Redimensionar prévia"
              ></div>
              <section class="pane preview-wrap" id="preview-pane">
                <div class="pane-head">
                  <span class="pv-label">Prévia</span>
                  <span class="pv-spacer"></span>
                  <div id="screen-slot"></div>
                </div>
                <div class="preview-body">
                  <div id="preview-stage" class="preview-stage">
                    <canvas id="preview" width="256" height="192"></canvas>
                  </div>
                </div>
              </section>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="login-view" class="login-view" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
