<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>previewer</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <div id="app">
      <header>
        <h1>previewer</h1>
        <div id="error" class="error" hidden></div>
      </header>
      <main>
        <aside id="sidebar">
          <section>
            <h2>Projetos</h2>
            <ul id="project-list"></ul>
            <label class="upload">
              Importar .zip
              <input id="upload" type="file" accept=".zip">
            </label>
          </section>
          <section>
            <h2>Arquivos</h2>
            <ul id="file-list"></ul>
          </section>
        </aside>
        <section id="workspace">
          <div id="toolbar">
            <select id="screen-select"></select>
            <button id="save">Salvar</button>
            <label>Zoom <input id="zoom" type="range" min="1" max="6" step="1" value="2"></label>
            <span id="status"></span>
          </div>
          <div class="panes">
            <div id="editor"></div>
            <div class="preview-wrap">
              <canvas id="preview" width="256" height="192"></canvas>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
