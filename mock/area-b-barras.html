<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mock B - duas barras contextuais</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; color: #1f2937; background: #f6f7f9; }
  .app { display: flex; flex-direction: column; height: 100vh; }

  .bar { display: flex; align-items: center; gap: 12px; padding: 4px 12px; background: #fff; }
  .bar.ctx { border-bottom: 1px solid #eef0f3; }
  .bar.doc { border-bottom: 1px solid #d6dade; }
  .spacer { flex: 1; }
  .crumb { color: #6b7280; }
  .crumb b { color: #1f2937; }
  .crumb .sep { margin: 0 6px; color: #cbd5e1; }

  .seg { border: 1px solid #d6dade; background: #f9fafb; padding: 3px 10px; cursor: pointer; font-size: 13px; }
  .seg:first-child { border-radius: 6px 0 0 6px; }
  .seg:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
  .seg.active { background: #eef2ff; border-color: #bfdbfe; color: #1d4ed8; font-weight: 600; }

  .btn { border: 1px solid #d6dade; background: #fff; padding: 4px 12px; border-radius: 6px; cursor: pointer; }
  .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600; }
  .btn.ghost { border-color: transparent; background: transparent; color: #6b7280; }
  .icon-btn { border: 0; background: transparent; color: #6b7280; cursor: pointer; font-size: 16px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #6b7280; }
  .count { font-size: 12px; color: #9aa4ad; }
  select { border: 1px solid #d6dade; border-radius: 6px; padding: 4px 8px; background: #fff; }

  .tabs { display: flex; gap: 2px; padding: 6px 12px 0; background: #eef0f3; border-bottom: 1px solid #d6dade; }
  .tab { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #d6dade; border-bottom: none; border-radius: 6px 6px 0 0; padding: 6px 10px; color: #6b7280; cursor: pointer; }
  .tab.active { border-color: #2563eb; color: #1d4ed8; }

  .body { display: flex; flex: 1; min-height: 0; }
  .tree { width: 240px; background: #fff; border-right: 1px solid #d6dade; padding: 10px; overflow: auto; }
  .tree h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #6b7280; margin: 0 0 8px; }
  .node { display: flex; align-items: center; gap: 6px; padding: 2px 4px; color: #6b7280; }
  .node.active { color: #2563eb; font-weight: 600; }
  .indent { margin-left: 16px; }
  .editor { flex: 1; padding: 12px; overflow: auto; }
  .card { background: #fff; border: 1px solid #d6dade; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.06); margin-bottom: 10px; }
  .card.active { border-color: #2563eb; box-shadow: 0 0 0 1px #2563eb; }
  .card-head { display: flex; justify-content: space-between; padding: 6px 12px; background: #f3f4f6; border-bottom: 1px solid #d6dade; font-size: 12px; color: #6b7280; }
  .card-body { padding: 12px; }
  .src { background: #f3f4f6; color: #6b7280; border-radius: 6px; padding: 8px; margin-bottom: 8px; }
  textarea { width: 100%; min-height: 40px; border: 1px solid #d6dade; border-radius: 6px; padding: 8px; font: inherit; resize: vertical; }
  .preview { width: 360px; background: #eef0f3; border-left: 1px solid #d6dade; padding: 12px; }
  .screen { width: 256px; height: 192px; margin: 0 auto; background: #2b2f3a; border: 4px solid #1f2937; border-radius: 8px; }
</style>
</head>
<body>
<div class="app">
  <!-- Barra de contexto (projeto/arquivo + visualização) -->
  <div class="bar ctx">
    <div class="crumb"><b>Playton 2</b><span class="sep">/</span>event<span class="sep">/</span>en<span class="sep">/</span><b>ev_t10.plz.txt</b></div>
    <div class="spacer"></div>
    <div class="label">Tela</div><select><option>Textos Normais</option></select>
    <div class="label">Zoom</div><input type="range" min="1" max="6" value="2">
    <button class="icon-btn" title="Tema">☾</button>
  </div>

  <!-- Barra do documento (editores/ações) -->
  <div class="bar doc">
    <button class="seg active">Segmentos</button><button class="seg">Editor</button>
    <button class="btn primary">Salvar</button>
    <button class="btn">Original</button>
    <span class="dot" title="não salvo"></span>
    <div class="spacer"></div>
    <button class="btn ghost">↑ Anterior</button>
    <button class="btn ghost">Próximo ↓</button>
    <span class="count">105 caracteres</span>
  </div>

  <div class="tabs">
    <div class="tab active">ev_t10.plz.txt ×</div>
    <div class="tab">ev_t11.plz.txt ×</div>
  </div>

  <div class="body">
    <aside class="tree">
      <h2>Arquivos</h2>
      <div class="node">▾ 📁 event</div>
      <div class="node indent">▾ 📁 en</div>
      <div class="node" style="margin-left:32px">📄 ev_t10.plz.txt</div>
      <div class="node" style="margin-left:32px;color:#2563eb;font-weight:600">📄 ev_t11.plz.txt</div>
    </aside>
    <main class="editor">
      <div class="card active">
        <div class="card-head"><span>#1</span><span>traduzido</span></div>
        <div class="card-body">
          <div class="src">Professor, we never stay in places as nice as this.</div>
          <textarea>Professor, nós nunca ficamos em lugares tão bonitos quanto este.</textarea>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><span>#2</span><span>vazio</span></div>
        <div class="card-body">
          <div class="src">Quite so, Luke.</div>
          <textarea placeholder="Traduza aqui..."></textarea>
        </div>
      </div>
    </main>
    <aside class="preview">
      <div class="label" style="margin-bottom:8px">Prévia</div>
      <div class="screen"></div>
    </aside>
  </div>
</div>
</body>
</html>
