services:
  app:
    build: .
    env_file: .env
    environment:
      STORAGE_ROOT: /data
      DATABASE_URL: postgresql+psycopg://previewer:previewer@db:5432/previewer
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storedata:/data

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: previewer
      POSTGRES_PASSWORD: previewer
      POSTGRES_DB: previewer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U previewer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  storedata:
  pgdata:
